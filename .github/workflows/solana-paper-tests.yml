name: Solana paper tests
on:
  push:
    branches: [solana-paper-desk]
    paths: ['solana-paper/**', '.github/workflows/solana-paper-tests.yml']
  pull_request:
    paths: ['solana-paper/**', '.github/workflows/solana-paper-tests.yml']
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s solana-paper -p 'test_*.py' -v
